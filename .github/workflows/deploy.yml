# Pubblica la webapp su GitHub Pages a ogni push su main.
# Dopo il primo push: repo → Settings → Pages → Source = "GitHub Actions".
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permette di lanciarlo a mano dal tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Prepara l'artefatto (tutta la radice del repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
