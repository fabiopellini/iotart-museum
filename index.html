<meta name="apple-mobile-web-app-title" content="Iotart-museum">
<meta name="application-name" content="Iotart-museum">
<meta name="description" content="Iotart-museum — gestione eventi museali e mostre: schede opera, informazioni a voce, voti con like.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=Archivo:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#120F0E; --wall:#1A1513; --wall2:#221B17; --card:#251E19; --card2:#2C231D;
  --line:rgba(207,166,83,.20); --line-soft:rgba(255,240,214,.09);
  --bone:#F1E8DA; --muted:#C9BBA4; --muted2:#AA9C83;
  --gold:#CFA653; --gold-soft:#E8CE94; --copper:#BA7040;
  --danger:#D9705A; --ok:#7F9C6A;
  --ff-d:'Fraunces',Georgia,serif; --ff-b:'Archivo',system-ui,-apple-system,sans-serif; --ff-m:'Spline Sans Mono',ui-monospace,monospace;
  --sh:0 26px 50px -28px rgba(0,0,0,.95), 0 2px 0 rgba(255,255,255,.03) inset;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff-b); color:var(--bone); min-height:100dvh;
  background:
    radial-gradient(130% 55% at 50% -12%, #3E2E20 0%, rgba(62,46,32,0) 58%),
    radial-gradient(90% 40% at 100% 100%, rgba(186,112,64,.14), transparent 60%),
    linear-gradient(180deg,#181311 0%, #120F0E 55%, #0E0B0A 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 80% at 50% 40%, transparent 55%, rgba(0,0,0,.55) 100%);}
h1,h2,h3,h4{margin:0;font-family:var(--ff-d);font-weight:400;letter-spacing:-.01em;
  font-variation-settings:'SOFT' 0,'WONK' 1,'opsz' 96}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
.mono{font-family:var(--ff-m)}
.eyebrow{font-family:var(--ff-m);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;border-radius:6px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;padding:calc(var(--safe-t) + 14px) 18px 12px;
  background:linear-gradient(180deg,rgba(18,15,14,.94),rgba(18,15,14,.72) 72%,rgba(18,15,14,0));
  backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%)}
.topbar__row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand__mark{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand__icon{width:24px;height:24px;border-radius:7px;object-fit:cover;
  box-shadow:0 0 0 1px rgba(207,166,83,.35), 0 4px 12px -4px rgba(0,0,0,.9)}
.brand__icon--lg{width:34px;height:34px;border-radius:10px}
.menubrand{display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;
  border:1px solid var(--line);background:linear-gradient(160deg,rgba(207,166,83,.12),rgba(207,166,83,.03));margin-bottom:18px}
.menubrand img{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 0 0 1px rgba(207,166,83,.35)}
.menubrand b{display:block;font-family:var(--ff-d);font-size:19px;font-weight:500;letter-spacing:-.01em}
.menubrand span{display:block;margin-top:3px;font-family:var(--ff-m);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold)}
.about{margin-top:6px}
.about p{font-size:14.5px;line-height:1.66;color:#E5DACB;margin:0 0 14px;font-family:var(--ff-d);font-variation-settings:'opsz' 20}
.about .k{display:grid;gap:9px;margin-top:16px}
.about .k div{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--muted)}
.about .k b{color:var(--gold-soft);font-family:var(--ff-m);font-size:11px;letter-spacing:.08em;min-width:78px;text-transform:uppercase}
.brand__dot{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFE6AE,var(--gold) 60%,var(--copper));
  box-shadow:0 0 12px rgba(207,166,83,.7)}
.brand__name{font-family:var(--ff-m);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1.event{font-size:clamp(23px,7.4vw,30px);line-height:1.02;font-weight:500}
.topbar .sub{margin-top:6px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;
  font-family:var(--ff-m);font-size:10.5px;letter-spacing:.08em;color:var(--gold-soft);background:rgba(207,166,83,.07)}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line-soft);display:grid;place-items:center;
  background:rgba(255,240,214,.04);color:var(--bone);flex:none;transition:.2s}
.iconbtn:active{transform:scale(.94);background:rgba(255,240,214,.09)}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.switcher{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 0 2px;margin:0 -18px;padding-left:18px;padding-right:18px}
.switcher::-webkit-scrollbar{display:none}
.switcher button{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line-soft);font-size:12px;color:var(--muted);white-space:nowrap}
.switcher button[aria-pressed="true"]{color:var(--ink);background:linear-gradient(180deg,var(--gold-soft),var(--gold));border-color:transparent;font-weight:600}

/* ---------- layout ---------- */
main{position:relative;z-index:1;padding:6px 18px 132px;max-width:720px;margin:0 auto}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 12px}
.section-head h2{font-size:19px}
.section-head .count{font-family:var(--ff-m);font-size:11px;color:var(--muted2);letter-spacing:.1em}
.empty{text-align:center;padding:44px 22px;border:1px dashed var(--line);border-radius:20px;color:var(--muted);margin-top:22px}
.empty h3{font-size:18px;color:var(--bone);margin-bottom:8px}
.empty p{font-size:13px;margin:0 auto;max-width:32ch;line-height:1.55}

/* ---------- work card ---------- */
.works{display:grid;gap:16px}
.work{position:relative;display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;
  padding:12px;border:1px solid var(--line-soft);border-radius:18px;background:linear-gradient(160deg,var(--card2),var(--card));
  box-shadow:var(--sh);text-align:left;transition:.22s;width:100%}
.work:active{transform:scale(.985);border-color:var(--line)}
.frame{position:relative;border-radius:11px;overflow:hidden;background:#0d0a09;aspect-ratio:3/4;
  box-shadow:inset 0 0 0 1px rgba(207,166,83,.22), 0 12px 24px -14px #000}
.frame img{width:100%;height:100%;object-fit:cover}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 75% at 50% -18%, rgba(255,231,184,.22), transparent 58%)}
.work__t{font-family:var(--ff-d);font-size:17px;line-height:1.16;font-variation-settings:'opsz' 40}
.work__a{margin-top:5px;font-size:12.5px;color:var(--muted)}
.work__d{margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cat-no{font-family:var(--ff-m);font-size:10px;letter-spacing:.14em;color:var(--gold)}
.tag{font-family:var(--ff-m);font-size:10px;letter-spacing:.06em;color:var(--muted2);border:1px solid var(--line-soft);padding:2px 7px;border-radius:6px}
.star-mini{position:absolute;top:11px;right:12px;font-size:13px;color:var(--gold);filter:drop-shadow(0 0 6px rgba(207,166,83,.6))}
.progressline{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:22px 0}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;
  background:rgba(8,6,5,.66);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:opacity .28s}
.sheet[data-open="1"]{opacity:1;pointer-events:auto}
.sheet__panel{position:relative;max-height:94dvh;overflow:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,var(--wall2),var(--wall) 40%,#141110);
  border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  padding:10px 18px calc(var(--safe-b) + 26px);transform:translateY(26px);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sheet[data-open="1"] .sheet__panel{transform:none}
.grab{width:44px;height:4px;border-radius:99px;background:rgba(255,240,214,.2);margin:4px auto 14px}
.sheet__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet__head h2{font-size:20px;line-height:1.1}

/* ---------- detail ---------- */
.detail__stage{position:relative;border-radius:16px;overflow:hidden;background:#0d0a09;margin-bottom:16px;
  box-shadow:inset 0 0 0 1px rgba(207,166,83,.22), 0 34px 60px -34px #000}
.detail__stage img{width:100%;max-height:42dvh;object-fit:contain;background:#0d0a09}
.detail__stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -16%, rgba(255,231,184,.20), transparent 55%)}
.detail h2{font-size:26px;line-height:1.06}
.detail__by{margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.detail__by .auth{font-family:var(--ff-d);font-size:15px;color:var(--gold-soft)}
.specs{margin:16px 0 0;border-top:1px solid var(--line-soft)}
.specs div{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line-soft)}
.specs dt{font-family:var(--ff-m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin:0}
.specs dd{margin:0;font-size:13.5px;text-align:right;color:var(--bone)}
.desc{margin-top:18px;font-size:14.5px;line-height:1.68;color:#E5DACB;white-space:pre-line;
  border-left:2px solid var(--line);padding-left:14px;font-family:var(--ff-d);font-variation-settings:'opsz' 20}
.actions{display:grid;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 18px;border-radius:15px;
  border:1px solid var(--line);font-size:14.5px;font-weight:600;transition:.2s;width:100%}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn--gold{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241B0C;border-color:transparent;
  box-shadow:0 16px 30px -16px rgba(207,166,83,.7)}
.btn--ghost{background:rgba(255,240,214,.045);color:var(--bone)}
.btn--on{background:rgba(207,166,83,.16);border-color:var(--line);color:var(--gold-soft)}
.btn:active{transform:scale(.985)}

/* ---------- ask ---------- */
.ask__work{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.ask__work .frame{width:56px;flex:none;border-radius:9px}
.ask__work h3{font-size:16px;line-height:1.2}
.ask__work p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.orbwrap{display:grid;place-items:center;padding:8px 0 4px}
.orb{position:relative;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;border:0;
  background:radial-gradient(circle at 50% 32%, #FFE9B8, var(--gold) 40%, var(--copper) 76%, #6C3C20 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.16), 0 26px 54px -20px rgba(207,166,83,.75), inset 0 -16px 26px rgba(88,44,14,.6);
  animation:breathe 4.4s ease-in-out infinite}
.orb svg{width:36px;height:36px;stroke:#2A1C0B;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.orb::before,.orb::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(207,166,83,.5);opacity:0}
.orb.listening{animation:none}
.orb.listening::before{animation:ripple 2.2s ease-out infinite}
.orb.listening::after{animation:ripple 2.2s ease-out .72s infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(2);opacity:0}}
.ask__state{margin-top:16px;text-align:center;font-family:var(--ff-m);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold);min-height:16px}
.ask__hint{margin-top:8px;text-align:center;font-size:12.5px;color:var(--muted2);padding:0 24px;line-height:1.5}
.qline{margin-top:18px;padding:12px 14px;border-radius:13px;background:rgba(255,240,214,.05);
  border:1px solid var(--line-soft);font-size:14px;color:var(--muted)}
.qline b{color:var(--bone);font-weight:600}
.answer{margin-top:14px;padding:16px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(207,166,83,.13),rgba(207,166,83,.04));display:none}
.answer[data-show="1"]{display:block;animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.answer .lbl{font-family:var(--ff-m);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.answer p{margin:9px 0 0;font-size:15px;line-height:1.62;font-family:var(--ff-d);font-variation-settings:'opsz' 20}
.answer__bar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.mini{padding:9px 13px;border-radius:11px;border:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);background:rgba(255,240,214,.04)}
.mini--on{color:var(--gold-soft);border-color:var(--line);background:rgba(207,166,83,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:18px;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:9px 13px;border-radius:999px;border:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);white-space:nowrap}
.chips button:active{background:rgba(255,240,214,.09)}
.askform{display:flex;gap:8px;margin-top:14px}
.askform input{flex:1;padding:13px 14px;border-radius:13px;border:1px solid var(--line-soft);
  background:rgba(0,0,0,.3);color:var(--bone);font-size:14px;font-family:var(--ff-b)}
.askform input::placeholder{color:var(--muted2)}
.askform button{padding:0 18px;border-radius:13px;background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241B0C;font-weight:700;font-size:14px}
.note{margin-top:14px;font-size:11.5px;line-height:1.6;color:var(--muted2)}

/* ---------- forms / manager ---------- */
.field{margin-top:14px}
.field label{display:block;font-family:var(--ff-m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line-soft);
  background:rgba(0,0,0,.3);color:var(--bone);font-size:14px;font-family:var(--ff-b);resize:vertical}
.field textarea{min-height:104px;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold);background:rgba(207,166,83,.06)}
.field .hintx{margin-top:6px;font-size:11.5px;color:var(--muted2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filebox{display:flex;gap:12px;align-items:center;padding:12px;border:1px dashed var(--line);border-radius:14px;margin-top:6px}
.filebox .thumb{width:64px;height:80px;flex:none;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;
  display:grid;place-items:center;color:var(--muted2);font-size:10px;font-family:var(--ff-m);border:1px solid var(--line-soft)}
.filebox .thumb img{width:100%;height:100%;object-fit:cover}
.filebox label.bpick{display:inline-block;padding:9px 13px;border-radius:11px;background:rgba(255,240,214,.06);
  border:1px solid var(--line-soft);font-size:12.5px;color:var(--bone);cursor:pointer;font-family:var(--ff-b);text-transform:none;letter-spacing:0}
.filebox input[type=file]{display:none}
.mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line-soft);
  border-radius:15px;background:linear-gradient(160deg,var(--card2),var(--card));margin-bottom:10px}
.mrow h4{font-size:15.5px;line-height:1.2}
.mrow p{margin:5px 0 0;font-size:12px;color:var(--muted)}
.mrow .tools{display:flex;gap:6px}
.tbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line-soft);display:grid;place-items:center;color:var(--muted)}
.tbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tbtn.danger{color:var(--danger)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.mhead .sub{font-size:12px;color:var(--muted);margin-top:4px}
.pinrow{display:flex;gap:8px;margin-top:14px}
.pinrow input{flex:1;padding:14px;border-radius:13px;border:1px solid var(--line-soft);background:rgba(0,0,0,.34);
  color:var(--bone);font-size:20px;letter-spacing:.42em;text-align:center;font-family:var(--ff-m)}
.pinrow button{padding:0 20px;border-radius:13px;background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241B0C;font-weight:700}
.warn{margin-top:12px;font-size:12px;color:var(--danger);min-height:8px}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;justify-content:center;
  padding:32px 22px calc(var(--safe-b) + 32px);background:
   radial-gradient(120% 50% at 50% 0%, #3E2E20, transparent 60%), linear-gradient(180deg,#181311,#0E0B0A)}
.gate[data-open="1"]{display:flex}
.gate h1{font-size:clamp(28px,9vw,38px);line-height:1;font-weight:500;margin:14px 0 10px}
.gate p.lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 26px;max-width:34ch}
.gate .cards{display:grid;gap:12px}
.gcard{text-align:left;padding:18px;border-radius:18px;border:1px solid var(--line-soft);
  background:linear-gradient(160deg,var(--card2),var(--card));box-shadow:var(--sh);transition:.2s}
.gcard:active{transform:scale(.985)}
.gcard h3{font-size:19px;margin-bottom:6px}
.gcard p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.gcard .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px;
  background:rgba(207,166,83,.14);border:1px solid var(--line)}
.gcard .ic svg{width:19px;height:19px;stroke:var(--gold-soft);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- tabbar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;gap:4px;
  padding:10px 12px calc(var(--safe-b) + 10px);
  background:linear-gradient(180deg,rgba(18,15,14,0),rgba(14,11,10,.92) 42%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabbar__in{display:flex;gap:2px;width:100%;max-width:420px;border:1px solid var(--line-soft);border-radius:18px;
  background:rgba(28,22,19,.9);padding:5px;box-shadow:var(--sh)}
.tab{flex:1;display:grid;gap:3px;place-items:center;padding:9px 4px;border-radius:14px;color:var(--muted2);transition:.2s}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;letter-spacing:.04em}
.tab[aria-pressed="true"]{color:var(--gold-soft);background:rgba(207,166,83,.13)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translate(-50%,14px);z-index:200;
  padding:11px 16px;border-radius:13px;background:rgba(240,231,218,.96);color:#1B1512;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
.toast[data-show="1"]{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.work{cursor:pointer}
.likebtn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
  background:rgba(207,166,83,.07);color:var(--gold-soft);font-size:12px;font-family:var(--ff-m);transition:.18s}
.likebtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.likebtn.on{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#241B0C;border-color:transparent}
.likebtn.on svg{fill:#241B0C;stroke:#241B0C}
.likebtn b{font-weight:600}
.tag svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.7;vertical-align:-1px;margin-right:3px}
.star-mini{z-index:3}
.cbox{margin-top:22px;border-top:1px solid var(--line-soft);padding-top:18px}
.clist{display:grid;gap:10px}
.cempty{font-size:13px;color:var(--muted2);padding:4px 0 2px;line-height:1.55}
.citem{padding:12px 14px;border-radius:13px;border:1px solid var(--line-soft);background:rgba(255,240,214,.035)}
.citem p{margin:7px 0 0;font-size:13.5px;line-height:1.55;color:#EAE0D2;white-space:pre-line}
.citem .who{font-family:var(--ff-m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.cform{margin-top:12px}
.cform textarea{width:100%;min-height:88px;padding:13px 14px;border-radius:13px;border:1px solid var(--line-soft);
  background:rgba(0,0,0,.3);color:var(--bone);font-size:14px;font-family:var(--ff-b);line-height:1.55;resize:vertical}
.cform textarea:focus{outline:none;border-color:var(--gold);background:rgba(207,166,83,.06)}
.cform textarea::placeholder{color:var(--muted2)}
.cbar{display:flex;gap:8px;margin-top:9px}
.cbar .mini{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.cbar .mini svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cmic.dict{background:rgba(217,112,90,.2);border-color:rgba(217,112,90,.55);color:#F2BCAA}
.rank{display:grid;grid-template-columns:22px 52px 1fr auto;gap:12px;align-items:center;padding:12px;
  border:1px solid var(--line-soft);border-radius:15px;background:linear-gradient(160deg,var(--card2),var(--card));margin-bottom:10px}
.rank__pos{font-family:var(--ff-d);font-size:19px;color:var(--gold);text-align:center;font-variation-settings:'opsz' 24}
.rank .frame{width:52px;aspect-ratio:3/4;border-radius:9px;overflow:hidden;background:#0d0a09;position:relative}
.rank .frame img{width:100%;height:100%;object-fit:cover}
.rank__meta{min-width:0}
.rank__meta h4{font-size:15px;line-height:1.2}
.rank__meta p{margin:4px 0 8px;font-size:12px;color:var(--muted)}
.bar{height:4px;border-radius:99px;background:rgba(255,240,214,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--copper),var(--gold-soft))}
.rank__n{text-align:right;font-family:var(--ff-m)}
.rank__n b{display:block;font-size:19px;color:var(--gold-soft);line-height:1}
.rank__n span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2)}
.rank__n em{display:block;margin-top:5px;font-size:10px;font-style:normal;color:var(--muted2)}
.setbox{margin-top:18px;padding:16px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(207,166,83,.11),rgba(207,166,83,.03))}
.setbox .field label{margin-bottom:7px}
.setbox input{font-size:13px}
.codebar{margin:12px 0 4px;padding:14px;border-radius:15px;border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(207,166,83,.13),rgba(207,166,83,.03))}
.codebar b{display:block;font-size:14px;margin-bottom:4px}
.codebar span{display:block;font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:9px}
.codebar input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line-soft);
  background:rgba(0,0,0,.34);color:var(--bone);font-size:15px;font-family:var(--ff-m);letter-spacing:.1em;text-transform:uppercase}
.codebar input:focus{outline:none;border-color:var(--gold)}
.codebar .cbar{margin-top:9px}
.codenote{margin:12px 0 2px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);
  background:rgba(207,166,83,.1);font-size:12.5px;color:var(--muted);font-family:var(--ff-m)}
.codenote b{color:var(--gold-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<main id="main"></main>
<nav class="tabbar" id="tabbar"></nav>

<!-- detail sheet -->
<div class="sheet" id="sh-detail"><div class="sheet__panel"><div class="grab"></div><div id="detailBody"></div></div></div>
<!-- ask sheet -->
<div class="sheet" id="sh-ask"><div class="sheet__panel"><div class="grab"></div><div id="askBody"></div></div></div>
<!-- form sheet -->
<div class="sheet" id="sh-form"><div class="sheet__panel"><div class="grab"></div><div id="formBody"></div></div></div>
<div class="sheet" id="sh-menu"><div class="sheet__panel"><div class="grab"></div><div id="menuBody"></div></div></div>

<div class="gate" id="gate"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   I COLORI DELLA MIA TERRA — catalogo mobile
   Visitatore: catalogo, preferiti, domanda vocale (STT) + risposta
   letta dal sintetizzatore vocale del telefono (TTS).
   Gestore: mostre + schede opera.

function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim(); }
function anyPhrase(t,arr){ return arr.some(k=> k.includes(" ") ? t.includes(k) : new RegExp("(^|\\s)"+k+"(\\s|$)").test(t)); }
const NO={ author:"Nella scheda non è indicato l'autore.", year:"La scheda non riporta l'anno di esecuzione.",
  price:"Per quest'opera la scheda non indica un prezzo: chiedi il listino allo staff della reception.",
  technique:"La scheda non specifica tecnica e misure.", room:"La posizione in sala non è indicata nella scheda.",
  desc:"Questa scheda non contiene un testo descrittivo." };
function answerFor(w,q){
  const t=norm(q);
  if(anyPhrase(t,["preferit","mi piace","salva"])) return {label:"Preferiti", text:(state.favs[w.id]
      ? "«"+w.title+"» è già tra i tuoi preferiti. Puoi ritrovarla filtrando il catalogo per preferiti."
      : "Fatto: ho aggiunto «"+w.title+"» ai tuoi preferiti. La ritrovi con il filtro Preferiti."), fav:!state.favs[w.id] };
  if(anyPhrase(t,["prezzo","prezzi","costo","costa","vale","comprare","acquist","vendita","listino","vende"]))
    return {label:"Prezzo", text: w.price ? "Il prezzo indicato in catalogo è "+w.price+"."
      : "Nella scheda di «"+w.title+"» il prezzo non è indicato. "+NO.price.replace(/^Per quest'opera la scheda non indica un prezzo: /,"") };
  if(anyPhrase(t,["autore","autrice","artista","pittore","pittrice","firma","firmato","chi ha dipinto","di chi e","chi l ha fatta"]))
    return {label:"Autore", text: w.author ? "«"+w.title+"» è di "+w.author+"." : NO.author };
  if(anyPhrase(t,["titolo","nome","si chiama","si intitola","intitolata"]))
    return {label:"Titolo", text:"L'opera si intitola «"+w.title+"»"+(w.author?", di "+w.author:"")+"." };
  if(anyPhrase(t,["anno","quando","data","epoca","periodo","vecchia","realizzata","dipinta"]))
    return {label:"Anno", text: w.year ? "L'opera è datata "+w.year+"." : NO.year };
  if(anyPhrase(t,["tecnica","materiale","materiali","come e fatta","come e realizzata","olio","tempera","acquerello","acrilico","dimensioni","grande","misura","misure","cm","tela","supporto"]))
    return {label:"Tecnica", text: w.technique ? "Tecnica e misure: "+w.technique+"." : NO.technique };
  if(anyPhrase(t,["dove","sala","posizione","si trova","appesa","parete"]))
    return {label:"Posizione", text: w.room ? "La trovi in "+w.room+"." : NO.room };
  if(anyPhrase(t,["descrizione","significato","significa","cosa parla","parla di","raccontami","spiegami","soggetto","raffigura","rappresenta","storia","perche","messaggio"]))
    return {label:"Descrizione", text: w.description || NO.desc };
  if(anyPhrase(t,["chi","cosa sai","dimmi","informazioni","scheda","parlami","presentami","tutto","riassunto"]))
    return {label:"Scheda", text:[ w.author, w.title+(w.year?", "+w.year:""), w.technique, w.room ].filter(Boolean).join(". ")+". "+(w.description||"") };
  if(anyPhrase(t,["ciao","salve","aiuto","come funziona","cosa puoi","buongiorno","buonasera"]))
    return {label:"Aiuto", text:"Ciao! Sono la voce di questa opera. Posso dirti chi l'ha dipinta, il titolo, l'anno, la tecnica e le misure, il prezzo se in catalogo, dove si trova in sala e di cosa parla. Fammi la domanda a voce." };
  const head=[ w.title+(w.author?", di "+w.author:"")+(w.year?", "+w.year:"") ].join("");
  return {label:"Risposta", text:"Su questa scheda posso dirti titolo, autore, anno, tecnica, prezzo, posizione e descrizione. "+head+". "+(w.description? w.description.slice(0,240):"") };
}

let cmRec=null, cmDictating=false, cmFinIdx=0;
/* Consuma i risultati del motore vocale prendendo SOLO i finali non ancora usati.

   questo indice il testo verrebbe riaccodato piu' volte (bug "non non vedo non vedo"). */
/*CM_CONSUME_START*/
function cmConsumeResults(results, fromIdx){
  let add="", interim="", idx=fromIdx;
  for(let i=fromIdx;i<results.length;i++){
    const res=results[i];
    const txt=String((res&&res[0]&&res[0].transcript)||"").trim();
    if(res.isFinal){ if(txt) add+=(add?" ":"")+txt; idx=i+1; }
    else if(txt){ interim=txt; }
  }
  return { add:add, interim:interim, idx:idx };
}
/*CM_CONSUME_END*/
function initCmRec(){
  if(!SR) return null;
  const r=new SR(); r.lang="it-IT"; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
  r.onstart=()=>{ cmFinIdx=0; cmDictating=true; paintCmMic(); };
  r.onend=()=>{ cmDictating=false; paintCmMic(); };
  r.onerror=ev=>{ cmDictating=false; paintCmMic();
    toast(ev.error==="not-allowed" ? "Microfono bloccato: consenti l'accesso nelle impostazioni"
        : ev.error==="no-speech" ? "Non ho sentito nulla: riprova"
        : "Dettatura interrotta: "+ev.error); };
  r.onresult=ev=>{
    const ta=$("#cmText"); if(!ta) return;
    const c=cmConsumeResults(ev.results, cmFinIdx);
    cmFinIdx=c.idx;
    if(c.add){ const cur=ta.value.replace(/\s+$/,""); ta.value=(cur?cur+" ":"")+c.add; }
    const st=$("#cmMic"); if(st) st.innerHTML=svg("mic")+" "+(c.interim?("… "+esc(c.interim)):"Ti ascolto…");
  };
  return r;
}
function startDictation(){
  const ta=$("#cmText"); if(!ta) return;
  if(!SR){ toast("Dettatura non supportata da questo browser: scrivi il commento"); ta.focus(); return; }
  cmRec=cmRec||initCmRec();
  if(cmDictating){ try{ cmRec.stop(); }catch(e){} return; }
  stopSpeak(); try{ rec&&rec.stop(); }catch(e){}
  buzz(16);
  try{ cmRec.start(); }catch(e){ toast("Microfono già attivo: riprova"); }
}

async function apiCall(path,opts){
  if(!state.apiBase) throw new Error("no_backend");
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(state.apiBase.replace(/\/+$/,"")+path,{
      ...opts, signal:ctl.signal,
      headers:{"Content-Type":"application/json",...((opts&&opts.headers)||{})}});
    let data=null; try{ data=await r.json(); }catch(e){ data={}; }
    if(!r.ok){ const err=new Error("http_"+r.status); err.status=r.status; err.data=data||{}; throw err; }
    return data;
  } finally { clearTimeout(to); }
}

/* --- Turnstile: widget invisibile, nessun attrito per il visitatore --- */
let tsWidgetId=null, tsResolve=null, tsLoaded=false;
function loadTurnstile(){
  const site=(state.cfg&&state.cfg.ts_site)||"";
  if(!site) return Promise.resolve(false);
  if(tsLoaded) return Promise.resolve(true);
  return new Promise(res=>{
    window.__tsLoad=()=>{
      try{
        const host=document.createElement("div"); host.style.display="none"; document.body.appendChild(host);
        tsWidgetId=turnstile.render(host,{sitekey:site,size:"invisible",
          callback:t=>{ if(tsResolve) tsResolve(t); }});
        tsLoaded=true; res(true);
      }catch(e){ res(false); }
    };
    const sc=document.createElement("script");
    sc.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tsLoad";
    sc.async=true; sc.defer=true; sc.onerror=()=>res(false);
    document.head.appendChild(sc);
  });
}
function getTsToken(){
  if(!(state.cfg&&state.cfg.ts_site)) return Promise.resolve("");
  return loadTurnstile().then(ok=>{
    if(!ok||!window.turnstile||tsWidgetId==null) return "";
    return new Promise(res=>{
      let done=false;
      const fin=t=>{ if(!done){ done=true; clearTimeout(to); tsResolve=null; res(t||""); } };
      const to=setTimeout(()=>fin(""),10000);
      tsResolve=fin;
      try{ turnstile.reset(tsWidgetId); turnstile.execute(tsWidgetId); }catch(e){ fin(""); }
    });
  }).catch(()=>"");
}
function apiBody(extra){
  return JSON.stringify({ ...extra, code:state.pcode||"", token:"" });
}
function handleApiError(e){
  const d=(e&&e.data)||{};
  if(e&&e.status===429){ const r=d.retry_after||60; toast("Troppi voti in poco tempo: riprova tra "+(r>60?Math.ceil(r/60)+" min":r+" s")); return "rate_limited"; }
  if(d.error==="need_code"){ toast("Serve il codice della mostra per votare: inseriscilo qui sopra"); return "need_code"; }
  if(d.error==="turnstile_failed"){ toast("Verifica di sicurezza fallita: ricarica la pagina e riprova"); return "turnstile_failed"; }
  if(d.error==="empty_text"){ toast("Il commento è vuoto"); return "empty_text"; }
  if(e&&String(e.message).indexOf("http_")===0){ toast("Backend: "+e.message); return e.message; }
  return "offline";
}

async function syncEvent(eid,silent){
  if(!state.apiBase) return false;
  const E=state.events.find(x=>x.id===eid)||ev(); if(!E) return false;
  try{
    const d=await apiCall("/state?event="+encodeURIComponent(E.id),{method:"GET"});
    for(const w of E.works){
      state.likes[w.id]=(d.likes&&d.likes[w.id]!=null)?Number(d.likes[w.id]):0;
      state.comments[w.id]=((d.comments&&d.comments[w.id])||[]).map(x=>({id:x.id,text:x.text,ts:x.ts}));
    }
    syncState={on:true,msg:"collegato",ts:Date.now()}; save(); return true;
  }catch(e){
    syncState={on:false,msg:"offline",ts:Date.now()};
    if(!silent) toast("Backend non raggiungibile: uso i dati locali");
    return false;
  }
}
async function pushLike(w,didLike){
  try{
    const token=await getTsToken();
    const d=await apiCall("/like",{method:"POST",
      body:JSON.stringify({event:ev().id,work:w.id,voter:state.voter,delta:didLike?1:-1,code:state.pcode||"",token})});
    if(typeof d.likes==="number") state.likes[w.id]=d.likes;
    if(typeof d.liked==="boolean") state.liked[w.id]=d.liked;
    syncState={on:true,msg:"collegato",ts:Date.now()}; save();
    return {ok:true};
  }catch(e){
    const why=handleApiError(e);
    syncState={on:false,msg:why,ts:Date.now()};
    return {ok:false,why};
  }
}
async function pushComment(w,text){
  try{
    const token=await getTsToken();
    const d=await apiCall("/comment",{method:"POST",
      body:JSON.stringify({event:ev().id,work:w.id,voter:state.voter,text,code:state.pcode||"",token})});
    if(d.comments) state.comments[w.id]=d.comments.map(x=>({id:x.id,text:x.text,ts:x.ts}));
    syncState={on:true,msg:"collegato",ts:Date.now()}; return {ok:true};
  }catch(e){
    const why=handleApiError(e);
    syncState={on:false,msg:why,ts:Date.now()};
    return {ok:false,why};
  }
}

      target.works.push({ id:uid(), cat:String(n).padStart(2,"0"), image:ui.photo||PLACEHOLDER, ...d });
    }
    save(); closeSheets(); toast(w?"Scheda aggiornata":"Opera aggiunta"); render();
  });
  openSheet("sh-form");

const PLACEHOLDER="data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 80"><rect width="60" height="80" fill="#1a1513"/><g fill="none" stroke="#4a3f34" stroke-width="1.4"><rect x="14" y="24" width="32" height="26" rx="3"/><path d="m16 46 8-9 6 7 5-5 9 7"/></g></svg>`);
function shrink(file,max,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{
        let {width:w,height:h}=im; const r=Math.min(1,max/Math.max(w,h));
        const c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(h*r);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",q));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");
  if(e.target.classList && e.target.classList.contains("sheet")){ closeSheets(); return; }
  if(!t) return;
  const a=t.dataset.act, id=t.dataset.id;
  switch(a){
    case "open-gate": if(state.role==="manager"){ ui.view="mostre"; openGate(); paintGate(true); } else openGate(); break;
    case "open-menu": openMenu(); break;
    case "about": openAbout(); break;
    case "menu-role": closeSheets();
      if(state.role==="manager"){ state.role="visitor"; ui.view="catalogo"; save(); render(); toast("Sei in modalità visitatore"); }
      else { openGate(); paintGate(true); } break;
    case "logout": state.role=null; save(); closeSheets(); ui.view="catalogo";
      openGate(); paintGate(false); toast("Logoff effettuato"); break;
    case "gate-role": paintGate(false); break;
    case "gate-pin": paintGate(true); break;
    case "set-role": state.role = id==="visitor" ? "visitor":"manager"; state.seen=true; ui.view = state.role==="manager"?"mostre":"catalogo"; save(); closeGate(); render(); break;
    case "check-pin": {
      const v=($("#pinIn").value||"").trim();
      if(v===String(state.pin)){ state.role="manager"; state.seen=true; ui.view="mostre"; save(); closeGate(); render(); }
      else { const wn=$("#pinWarn"); wn.textContent="PIN errato. Riprova."; $("#pinIn").value=""; }
      break; }
    case "exit-manager": state.role="visitor"; ui.view="catalogo"; save(); closeGate(); render(); toast("Sei in modalità visitatore"); break;
    case "tab": ui.view=id; paint(); paintTabs(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "pick-event": state.activeEvent=id; save(); render(); break;
    case "open-work": openDetail(id); break;
    case "open-works": state.activeEvent=id; ui.view="opere"; save(); render(); break;
    case "close": closeSheets(); break;
    case "ask": closeSheets(); openAsk(id); break;
    case "mic": startListen(); break;
    case "replay": if(ui.askAns) speak(ui.askAns,true); break;
    case "tts": state.ttsOn=!state.ttsOn; save(); t.classList.toggle("mini--on",state.ttsOn); t.textContent="Voce "+(state.ttsOn?"attiva":"disattivata"); if(!state.ttsOn) stopSpeak(); break;
    case "chip": handleQuestion(t.dataset.q); break;
    case "fav": { const w=wo(id); if(!w) break;
      if(state.favs[id]) delete state.favs[id]; else state.favs[id]=true;
      save(); openDetail(id); toast(state.favs[id]?"Aggiunta ai preferiti":"Rimossa dai preferiti"); break; }
    case "read": { const w=wo(id); if(!w) break;
      speak([w.title,"di "+w.author,w.year,w.technique,w.description].filter(Boolean).join(". "),true); toast("Lettura avviata"); break; }
    case "like": { const w=wo(id); if(!w) break;
      const nowLiked=!state.liked[id];
      state.liked[id]=nowLiked;
      state.likes[id]=Math.max(0,likeCount(id)+(nowLiked?1:-1));
      save(); buzz(12);
      if(ui.sheet==="sh-detail") openDetail(id); else paint();
      toast(nowLiked?"Grazie per il like!":"Like rimosso");
      if(state.apiBase) pushLike(w,nowLiked).then(r=>{
        if(!r.ok){ state.liked[id]=!nowLiked; state.likes[id]=Math.max(0,likeCount(id)+(nowLiked?-1:1)); save(); }
        const again=openDetail; if(ui.sheet==="sh-detail") openDetail(id); else paint();
        if(!r.ok && (r.why==="need_code"||r.why==="rate_limited")){ if(ui.sheet==="sh-detail") openDetail(id); }
      });
      break; }
    case "api-save": { const el=$("#apiBase"); state.apiBase=((el&&el.value)||"").trim().replace(/\/+$/,""); save();
      if(state.apiBase){ toast("Collegamento al backend…"); syncEvent(ev().id).then(()=>paint()); }
      else { toast("Backend rimosso: modalità locale"); paint(); } break; }
    case "api-sync": syncEvent(ev().id).then(()=>{ paint(); toast(syncState.on?"Sincronizzato con il backend":"Backend non raggiungibile"); }); break;
    case "api-clear": state.apiBase=""; syncState={on:false,msg:"",ts:0}; save(); paint(); toast("Modalità locale attiva"); break;
    case "save-pcode": { const bar=t.closest(".codebar"); const inp=bar&&bar.querySelector("input");
      const v=((inp&&inp.value)||"").trim(); if(!v){ toast("Inserisci il codice della mostra"); break; }
      state.pcode=v.toUpperCase(); save(); toast("Codice salvato: ora puoi votare");
      if(ui.sheet==="sh-detail"&&ui.curWork) openDetail(ui.curWork.id); else paint(); break; }
    case "cm-mic": startDictation(); break;
    case "cm-send": sendComment(id); break;
    case "new-event": openEventForm(null); break;
    case "edit-event": openEventForm(id); break;
    case "del-event": { const evx=state.events.find(x=>x.id===id); if(!evx) break;
      if(state.events.length<2){ toast("Serve almeno una mostra"); break; }
      if(confirm('Eliminare «'+evx.name+'» e tutte le sue opere?')){ state.events=state.events.filter(x=>x.id!==id); state.activeEvent=state.events[0].id; save(); ui.view="mostre"; render(); } break; }
    case "new-work": openWorkForm(null); break;
    case "edit-work": openWorkForm(id); break;
    case "del-work": { const w=wo(id); if(!w) break;
      if(confirm('Eliminare «'+w.title+'»?')){ const e2=ev(); e2.works=e2.works.filter(x=>x.id!==id); delete state.favs[id]; delete state.likes[id]; delete state.liked[id]; delete state.comments[id]; save(); render(); toast("Opera eliminata"); } break; }
    case "export": { const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob); const a2=document.createElement("a");
      a2.href=url; a2.download="catalogo-mostra.json"; a2.click(); setTimeout(()=>URL.revokeObjectURL(url),4000); break; }
    case "reset": if(confirm("Ripristinare i dati demo? Le opere inserite verranno perse.")){ state=seedState(); save(); ui.view="mostre"; render(); toast("Dati demo ripristinati"); } break;
  }
});

  try{
    const m={name:"Iotart-museum",short_name:"Iotart-museum",start_url:".",scope:".",display:"standalone",
      background_color:"#120F0E",theme_color:"#120F0E",lang:"it",
      description:"Gestione eventi museali e mostre: schede opera, informazioni a voce, voti con like.",
      icons:[{src:ICON192,sizes:"192x192",type:"image/jpeg",purpose:"any"},
             {src:ICON512,sizes:"512x512",type:"image/jpeg",purpose:"any"},
             {src:ICON512,sizes:"512x512",type:"image/jpeg",purpose:"maskable"}]};
    const l=document.createElement("link"); l.rel="manifest";
    l.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(m));
    document.head.appendChild(l);
  }catch(e){}
})();

/* ---------------- avvio ---------------- */
if(state.apiBase==null) state.apiBase=API_DEFAULT;
if(!state.voter) state.voter=uid();
state.cfg=state.cfg||{ts_site:"",need_code:false,protected:false};
if(state.pcode==null) state.pcode="";
try{ const c=new URLSearchParams(location.search).get("c"); if(c) state.pcode=c.trim().toUpperCase(); }catch(e){}
render();
if(state.apiBase){ loadConfig().then(()=>{ syncEvent(ev().id,true).then(()=>render()); }); }
if(!state.seen){ openGate(); paintGate(false); }
</script>
